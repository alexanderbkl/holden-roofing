<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Robinson &amp; Sons Roofing &amp; Remodeling</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 1rem; padding: 2rem; text-align: center; background: #0a1a2b; color: #fff; font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { margin: 0; font: italic 600 clamp(5rem, 22vw, 10rem)/1 Georgia, serif; color: #3fe0c5; }
    p { margin: 0; opacity: .8; }
    a { display: inline-block; margin-top: .6rem; padding: 1rem 1.7rem; border-radius: 999px; background: #0b7a6d; color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>This page has blown off the roof. Let’s get you back home.</p>
  <a id="home" href="/">Back to the homepage</a>
  <script>
    // GitHub project pages live under /<repo>/, so derive the site root at runtime.
    var seg = location.pathname.split("/")[1];
    document.getElementById("home").href = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
  </script>
</body>
</html>
